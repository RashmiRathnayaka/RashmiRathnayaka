
      - name: Apply Dark Calendar Theme
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          file = Path("dist/contribution-calendar.svg")
          svg = file.read_text()

          # Add a black background
          svg = re.sub(
              r'(<svg\b[^>]*>)',
              r'\1<rect width="100%" height="100%" fill="#000000"/>',
              svg,
              count=1
          )

          # Change empty white contribution squares to dark grey
          svg = svg.replace("#ebedf0", "#161b22")
          svg = svg.replace("#EBEDF0", "#161b22")

          file.write_text(svg)
          PY

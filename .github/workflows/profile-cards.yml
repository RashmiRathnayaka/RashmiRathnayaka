
name: Generate Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: RashmiRathnayaka
          outputs: |
            dist/contribution-calendar.svg?color_dots=%23000000,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Add Black Background
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          file = Path("dist/contribution-calendar.svg")
          svg = file.read_text()

          svg = re.sub(
              r'(<svg\b[^>]*>)',
              r'\1<rect width="100%" height="100%" fill="#000000"/>',
              svg,
              count=1
          )

          file.write_text(svg)
          PY

      - name: Publish Calendar
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: calendar
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
